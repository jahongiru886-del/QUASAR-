<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kirish so'rovi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060A08;
    --surface: rgba(10,20,15,0.82);
    --ink:#C9FFD8;
    --ink-dim:#4F8F66;
    --neon:#39FF8A;
    --neon-2:#22D3EE;
    --line: rgba(57,255,138,0.28);
    --error:#FF4D6D;
    color-scheme: dark;
  }
  html{
    height:100%;
    scroll-padding-top: env(safe-area-inset-top, 0px);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100%;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(57,255,138,0.10), transparent 55%),
      radial-gradient(ellipse at 85% 90%, rgba(34,211,238,0.10), transparent 50%),
      var(--bg);
    color:var(--ink);
    font-family:'JetBrains Mono', ui-monospace, monospace;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: calc(28px + env(safe-area-inset-top, 0px)) 18px calc(28px + env(safe-area-inset-bottom, 0px));
    overflow-x:hidden;
    position:relative;
  }

  /* scanlines */
  body::after{
    content:"";
    position:fixed; inset:0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,255,130,0.025) 3px,
      rgba(0,0,0,0) 4px
    );
    pointer-events:none;
    z-index:5;
  }

  .stage{
    perspective: 900px;
    width:100%;
    max-width:380px;
  }

  .card{
    position:relative;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:4px;
    padding:30px 26px 26px;
    backdrop-filter: blur(6px);
    box-shadow:
      0 0 0 1px rgba(57,255,138,0.06),
      0 25px 60px -20px rgba(0,0,0,0.8),
      0 0 40px -10px rgba(57,255,138,0.15);
    transform-style: preserve-3d;
    transform: rotateX(0deg) rotateY(0deg);
    transition: transform .12s ease-out;
  }
  .card::before{
    content:"";
    position:absolute; inset:-1px;
    border-radius:4px;
    padding:1px;
    background: linear-gradient(135deg, var(--neon), transparent 40%, var(--neon-2) 85%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    opacity:0.5;
    pointer-events:none;
  }

  .top-row{
    display:flex; align-items:center; gap:10px;
    margin-bottom:22px;
  }
  .dot{ width:8px; height:8px; border-radius:50%; background:var(--neon); box-shadow:0 0 8px var(--neon); }
  .path{
    font-size:0.72rem;
    color:var(--ink-dim);
    letter-spacing:0.02em;
  }

  h1{
    font-family:'Share Tech Mono', monospace;
    font-size:1.5rem;
    font-weight:400;
    letter-spacing:0.02em;
    margin:0 0 6px;
    color:var(--neon);
    text-shadow: 0 0 14px rgba(57,255,138,0.45);
  }
  h1 .cursor{
    display:inline-block;
    width:10px; height:1.1em;
    background:var(--neon);
    margin-left:4px;
    vertical-align:text-bottom;
    animation: blink 1.1s step-end infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  .sub{
    color:var(--ink-dim);
    font-size:0.82rem;
    line-height:1.6;
    margin:0 0 26px;
  }

  form{ display:flex; flex-direction:column; gap:16px; }

  .field{ position:relative; }
  label{
    display:block;
    font-size:0.7rem;
    color:var(--ink-dim);
    margin-bottom:7px;
    letter-spacing:0.03em;
  }
  label::before{ content:"> "; color:var(--neon); }

  input{
    width:100%;
    background: rgba(0,0,0,0.35);
    border:1px solid var(--line);
    border-radius:3px;
    padding:12px 13px;
    font-family:'JetBrains Mono', monospace;
    font-size:0.92rem;
    color:var(--ink);
    outline:none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  input::placeholder{ color: rgba(79,143,102,0.6); }
  input:focus{
    border-color:var(--neon);
    box-shadow: 0 0 0 1px rgba(57,255,138,0.25), 0 0 18px -4px rgba(57,255,138,0.5);
  }
  input.err{ border-color:var(--error); box-shadow:0 0 14px -4px rgba(255,77,109,0.5); }

  .msg{
    font-size:0.72rem;
    color:var(--error);
    min-height:14px;
    margin-top:4px;
  }

  button{
    margin-top:6px;
    width:100%;
    border:1px solid var(--neon);
    border-radius:3px;
    padding:13px;
    font-family:'Share Tech Mono', monospace;
    font-size:0.92rem;
    letter-spacing:0.04em;
    color:#04150C;
    background:var(--neon);
    cursor:pointer;
    box-shadow: 0 0 22px -4px rgba(57,255,138,0.6);
    transition: transform .1s ease, box-shadow .15s ease, opacity .15s ease;
  }
  button:hover{ box-shadow: 0 0 30px -2px rgba(57,255,138,0.85); }
  button:active{ transform:scale(0.98); }
  button:disabled{ opacity:0.55; cursor:default; }
  button:focus-visible{ outline:2px solid var(--neon-2); outline-offset:3px; }

  .status{
    margin-top:16px;
    text-align:center;
    font-size:0.78rem;
    min-height:18px;
    color:var(--ink-dim);
  }
  .status.ok{ color:var(--neon); text-shadow:0 0 8px rgba(57,255,138,0.5); }

  .demo-tag{
    text-align:center;
    margin-top:20px;
    font-size:0.68rem;
    color:var(--ink-dim);
    letter-spacing:0.03em;
  }

  @media (prefers-reduced-motion: reduce){
    .card{ transition:none; }
    h1 .cursor{ animation:none; }
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="card" id="card">
    <div class="top-row">
      <span class="dot"></span>
      <span class="path">~/access/request.sh</span>
    </div>

    <h1>kirish so'rovi<span class="cursor"></span></h1>
    <p class="sub">Ma'lumotlaringizni kiriting — so'rov darhol boshliqqa yuboriladi.</p>

    <form id="form" novalidate>
      <div class="field">
        <label for="nick">nick_name</label>
        <input id="nick" type="text" placeholder="masalan: guy_dev" autocomplete="off">
        <div class="msg" id="nickMsg"></div>
      </div>
      <div class="field">
        <label for="login">login</label>
        <input id="login" type="text" placeholder="login kiriting" autocomplete="off">
        <div class="msg" id="loginMsg"></div>
      </div>
      <button type="submit" id="submitBtn">YUBORISH</button>
      <div class="status" id="status"></div>
    </form>

    <div class="demo-tag">// demo rejim — bot ulanmagan</div>
  </div>
</div>

<script>
  (function(){
    try{
      var tg = window.Telegram && window.Telegram.WebApp;
      if(tg){ tg.ready(); tg.expand(); }
    }catch(e){}

    // subtle 3D tilt on pointer move
    var stage = document.getElementById('stage');
    var card = document.getElementById('card');
    function onMove(x, y){
      var r = stage.getBoundingClientRect();
      var px = (x - r.left) / r.width - 0.5;
      var py = (y - r.top) / r.height - 0.5;
      card.style.transform = 'rotateY(' + (px*8) + 'deg) rotateX(' + (py*-8) + 'deg)';
    }
    if(window.matchMedia('(hover: hover)').matches){
      stage.addEventListener('mousemove', function(e){ onMove(e.clientX, e.clientY); });
      stage.addEventListener('mouseleave', function(){ card.style.transform = 'rotateX(0deg) rotateY(0deg)'; });
    }

    var form = document.getElementById('form');
    var nick = document.getElementById('nick');
    var login = document.getElementById('login');
    var nickMsg = document.getElementById('nickMsg');
    var loginMsg = document.getElementById('loginMsg');
    var status = document.getElementById('status');
    var btn = document.getElementById('submitBtn');

    function validate(){
      var ok = true;
      if(!nick.value.trim()){
        nick.classList.add('err'); nickMsg.textContent = "majburiy maydon"; ok = false;
      } else { nick.classList.remove('err'); nickMsg.textContent = ""; }
      if(!login.value.trim()){
        login.classList.add('err'); loginMsg.textContent = "majburiy maydon"; ok = false;
      } else { login.classList.remove('err'); loginMsg.textContent = ""; }
      return ok;
    }

    form.addEventListener('submit', function(e){
      e.preventDefault();
      if(!validate()) return;

      btn.disabled = true;
      btn.textContent = "YUBORILMOQDA...";
      status.className = "status";
      status.textContent = "";

      setTimeout(function(){
        var payload = { nick: nick.value.trim(), login: login.value.trim() };
        try{
          var tg = window.Telegram && window.Telegram.WebApp;
          if(tg && tg.sendData){ tg.sendData(JSON.stringify(payload)); }
        }catch(e){}

        btn.disabled = false;
        btn.textContent = "YUBORISH";
        status.className = "status ok";
        status.textContent = "> yuborildi (demo): " + payload.nick + " / " + payload.login;
      }, 700);
    });
  })();
</script>

</body>
</html>
